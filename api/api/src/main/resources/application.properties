# ── Base de datos ────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mates_aconcagua}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Servidor ─────────────────────────────────────────────────
server.port=${PORT:8080}

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── MercadoPago ──────────────────────────────────────────────
mercadopago.access-token=${MP_ACCESS_TOKEN}

# ── URL base del frontend (para back URLs de MercadoPago) ────
app.base-url=${APP_BASE_URL:https://project-hoqu0.vercel.app}

# ── URL pública de este backend (para el webhook de MercadoPago) ─
app.api-base-url=${API_BASE_URL:http://localhost:8080}

# ── Notificaciones a n8n (mails de compra exitosa/fallida) ────
n8n.compra-exitosa-url=${N8N_COMPRA_EXITOSA_URL:}
n8n.compra-fallida-url=${N8N_COMPRA_FALLIDA_URL:}
n8n.webhook-secret=${N8N_WEBHOOK_SECRET:}

# ── CORS ─────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ── Actuator (health check) ──────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Email (Brevo API HTTP — Railway bloquea SMTP saliente) ────
brevo.api-key=${BREVO_API_KEY:}
mail.from=${MAIL_FROM:no-reply@matesaconcahua.com}
