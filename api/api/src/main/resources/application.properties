# ── Base de datos ────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mates_aconcagua}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Servidor ─────────────────────────────────────────────────
server.port=${PORT:8080}

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── MercadoPago ──────────────────────────────────────────────
mercadopago.access-token=${MP_ACCESS_TOKEN}

# ── URL base del frontend (para back URLs de MercadoPago) ────
app.base-url=${APP_BASE_URL:https://project-hoqu0.vercel.app}

# ── CORS ─────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ── Actuator (health check) ──────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
